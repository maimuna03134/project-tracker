<!-- flash() diye pathano message (success / error) -->
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="fixed top-24 right-4 sm:right-6 z-[60] flex flex-col gap-space-sm w-[calc(100vw-2rem)] sm:w-96">
    {% for category, message in messages %}
    <div class="flex items-start gap-space-sm p-space-md rounded-xl shadow-lg
        {% if category == 'error' %}bg-error-container text-on-error-container
        {% elif category == 'success' %}bg-tertiary-container text-on-tertiary
        {% else %}bg-inverse-surface text-inverse-on-surface{% endif %}">
        <span class="material-symbols-outlined text-[20px]">{% if category == 'error' %}error{% elif category ==
            'success' %}task_alt{% else %}info{% endif %}</span>
        <span class="font-label-md text-label-md flex-1">{{ message }}</span>
    </div>
    {% endfor %}
</div>
{% endif %}
{% endwith %}
